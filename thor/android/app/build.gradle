plugins {
    id 'com.android.application'
}

android {
    namespace 'de.harmssi.thorconquer'
    compileSdk 35
    buildToolsVersion '35.0.0'

    // Fester Debug-Schluessel (liegt auf dem Build-Host unter /mnt/cache/thor-conquer/keystore),
    // damit spaetere Builds ueber die installierte Version installiert werden koennen.
    signingConfigs {
        thor {
            storeFile file(System.getenv('THOR_KEYSTORE') ?: '/work/keystore/thorconquer.jks')
            storePassword System.getenv('THOR_KEYSTORE_PASS') ?: 'thorconquer'
            keyAlias 'thorconquer'
            keyPassword System.getenv('THOR_KEYSTORE_PASS') ?: 'thorconquer'
        }
    }

    defaultConfig {
        applicationId 'de.harmssi.thorconquer'
        minSdk 33
        targetSdk 33
        versionCode (project.hasProperty('thorVersionCode') ? (project.thorVersionCode as Integer) : 3)
        versionName (project.hasProperty('thorVersionName') ? project.thorVersionName : '0.3.0-m3')
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets {
        main {
            // java-sdl: org/libsdl/app/*.java aus dem SDL2-Quellarchiv (vom Build-Skript gestaged)
            java.srcDirs += 'src/main/java-sdl'
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.thor
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.thor
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
